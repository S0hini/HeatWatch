  <text class="tl" x="40" y="348">Backend · Auth (Firebase)</text>
  <rect class="dash" x="40" y="356" width="600" height="76" rx="12"/>

  <rect class="box-coral" x="58" y="372" width="156" height="44" rx="6" stroke-width="0.5"/>
  <text class="th text-coral" x="136" y="390" text-anchor="middle">Firebase Auth</text>
  <text class="ts text-coral" x="136" y="407" text-anchor="middle">Email + Google OAuth</text>

  <rect class="box-coral" x="230" y="372" width="140" height="44" rx="6" stroke-width="0.5"/>
  <text class="th text-coral" x="300" y="390" text-anchor="middle">AuthContext</text>
  <text class="ts text-coral" x="300" y="407" text-anchor="middle">Session state</text>

  <rect class="box-coral" x="386" y="372" width="140" height="44" rx="6" stroke-width="0.5"/>
  <text class="th text-coral" x="456" y="390" text-anchor="middle">ZoneContext</text>
  <text class="ts text-coral" x="456" y="407" text-anchor="middle">Shared zone state</text>

  <rect class="box-gray" x="542" y="372" width="86" height="44" rx="6" stroke-width="0.5"/>
  <text class="th text-gray" x="585" y="390" text-anchor="middle">Vercel</text>
  <text class="ts text-gray" x="585" y="407" text-anchor="middle">Deployment</text>

  <!-- Legend -->
  <rect x="40" y="456" width="600" height="106" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
