      .text-blue  { fill: #0C447C; }
      .text-coral { fill: #712B13; }
      .text-gray  { fill: #444441; }
      .arr { stroke: #888780; stroke-width: 1px; fill: none; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 5 4; }
