  <rect class="box-blue" x="354" y="488" width="14" height="14" rx="3" stroke-width="0.5"/>
  <text class="ts" x="374" y="500">External APIs</text>

  <rect class="box-coral" x="480" y="488" width="14" height="14" rx="3" stroke-width="0.5"/>
  <text class="ts" x="500" y="500">Auth / context</text>

  <text class="ts" x="56" y="524">Stack: React · TypeScript · Vite · Firebase · Recharts · Leaflet · Tailwind CSS</text>
