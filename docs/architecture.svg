  <rect class="box-blue" x="244" y="252" width="152" height="44" rx="6" stroke-width="0.5"/>
  <text class="th text-blue" x="320" y="270" text-anchor="middle">Nominatim</text>
  <text class="ts text-blue" x="320" y="287" text-anchor="middle">Geocoding · autocomplete</text>

  <rect class="box-blue" x="412" y="252" width="148" height="44" rx="6" stroke-width="0.5"/>
